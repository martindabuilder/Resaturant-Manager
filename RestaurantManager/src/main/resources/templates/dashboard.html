
<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Manager - Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<main>
    <h1>Restaurant Manager</h1>

    <h2>Табло за управление</h2>

    <p>
        Добре дошли,
        <strong th:text="${username}">Username</strong>!
    </p>

    <p>
        Ваша роля:
        <strong th:text="${role}">ROLE</strong>
    </p>

    <hr>

    <h3>Управление на ресторанта</h3>

    <ul>
        <li><a th:href="@{/users}">Служители</a></li>
        <li><a th:href="@{/categories}">Категории</a></li>
        <li><a th:href="@{/dishes}">Ястия</a></li>
        <li><a th:href="@{/tables}">Управление на маси</a></li>
        <li><a th:href="@{/reservations}">Резервации</a></li>
        <li><a th:href="@{/orders}">Поръчки</a></li>
        <li><a th:href="@{/notifications}">Известия</a></li>
    </ul>


    <form th:action="@{/logout}" method="post">
        <button type="submit">Изход</button>
    </form>

</main>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Manager - Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<main>
    <h1>Restaurant Manager</h1>

    <h2>Dashboard</h2>

    <p>
        Welcome,
        <strong th:text="${username}">Username</strong>!
    </p>

    <p>
        Your role:
        <strong th:text="${role}">ROLE</strong>
    </p>

    <hr>

    <h3>Navigation</h3>

    <ul>
        <li><a th:href="@{/restaurant/users}">Users</a></li>
        <li><a th:href="@{/restaurant/categories}">Categories</a></li>
        <li><a th:href="@{/restaurant/dishes}">Dishes</a></li>
        <li><a th:href="@{/restaurant/tables}">Tables</a></li>
        <li><a th:href="@{/restaurant/reservations}">Reservations</a></li>
        <li><a th:href="@{/restaurant/orders}">Orders</a></li>
        <li><a th:href="@{/restaurant/notifications}">Notifications</a></li>
    </ul>

    <hr>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Log Out</button>
    </form>

</main>

</body>
</html>
